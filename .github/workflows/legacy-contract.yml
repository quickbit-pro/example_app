name: Legacy platform boundary
on: [push, pull_request]
jobs:
  integer-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify-legacy-contract.py
      - run: python3 scripts/tests/test_legacy_contract.py
      - run: python3 scripts/tests/test_legacy_release.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test backend/tests/NeoBanking.Api.Tests/NeoBanking.Api.Tests.csproj --filter FullyQualifiedName~LegacyPlatformContractTests
